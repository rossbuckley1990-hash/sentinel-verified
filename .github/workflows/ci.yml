name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js demo --store "$RUNNER_TEMP/sentinel-demo"
      - name: Adversarial benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run benchmark
      - name: Public provenance and outcome evaluation
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run benchmark:public
      - name: Check package contents
        run: npm pack --dry-run
