name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "'v' + require('./package.json').version")" = "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - run: npm ci
      - name: Install explicit test browser
        run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm test
        env:
          SENTINEL_TEST_BROWSER: "1"
      - run: node dist/cli.js demo --store "$RUNNER_TEMP/sentinel-demo"
      - run: npm run benchmark
      - run: npm run benchmark:public
      - name: Public API and React release gate
        run: |
          npm ci --prefix benchmarks/web/runtime --ignore-scripts
          node benchmarks/web/run.mjs --allow-local --out=benchmark-results/public-web.json
      - run: npm pack
      - name: Publish GitHub release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" sentinel-verified-*.tgz --verify-tag --generate-notes --title "SENTINEL $RELEASE_TAG"
